server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

frontend-url: ${FRONTEND_URL:http://localhost:4200}

quickbite:
  integrations:
    cart-service:
      base-url: ${CART_SERVICE_URL:http://localhost:8085}
#    payment-service:
#      base-url: ${PAYMENT_SERVICE_URL:http://payment-service}

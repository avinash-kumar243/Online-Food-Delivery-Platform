spring:
  application:
    name: eureka-server

server:
  port: ${PORT:8761}
  client:
    register-with-eureka: false 
    fetch-registry: false 
      
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: menu-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:menu-service-db}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        order_inserts: true
        order_updates: true

  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:http://localhost:9090}
        username: ${ADMIN_SERVER_USERNAME:}
        password: ${ADMIN_SERVER_PASSWORD:}
        instance:
          prefer-ip: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}

frontend-url: ${FRONTEND_URL:http://localhost:4200}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:${EUREKA_URL:http://localhost:8761/eureka}}
    register-with-eureka: ${EUREKA_REGISTER:true}
    fetch-registry: ${EUREKA_FETCH:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
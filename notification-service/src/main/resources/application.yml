spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/notificationdb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  application:
    name: notification-service
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    # properties: 
    #   hibernate:
    #     dialect: org.hibernate.dialect.MySQL8Dialect
  jackson:
    time-zone: UTC

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        concurrency: ${RABBITMQ_LISTENER_CONCURRENCY:3}
        max-concurrency: ${RABBITMQ_LISTENER_MAX_CONCURRENCY:8}
        prefetch: ${RABBITMQ_LISTENER_PREFETCH:40}
      direct:
        default-requeue-rejected: false
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

  cloud:
    compatibility-verifier:
      enabled: false # Added this to match your other services

server:
  port: ${PORT:8088}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  packages-to-scan: com.quickbite.notification.controller
  swagger-ui:
    path: /swagger-ui/index.html

quickbite:
  sms:
    provider: ${SMS_PROVIDER:placeholder}
    endpoint: ${SMS_GATEWAY_ENDPOINT:https://example-sms-gateway.local}
    api-key: ${SMS_GATEWAY_API_KEY:replace-me}
